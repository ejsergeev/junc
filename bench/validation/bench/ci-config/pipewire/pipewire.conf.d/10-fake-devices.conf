# CI stand-ins for hardware, created by the PipeWire server at startup (like real devices would be),
# so they survive/return across `pipewire` restarts. Not used on a real machine.
context.objects = [
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = fake.hwin node.description = FakeMic
      media.class = Audio/Source/Virtual audio.position = [ MONO ] } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = fake.hp node.description = FakeHeadphones
      media.class = Audio/Sink audio.position = [ FL FR ] } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = fake.obs node.description = FakeOBS
      media.class = Audio/Sink audio.position = [ FL FR ] } }
]
