# WirePlumber >= 0.5 ignores the Lua config next to this file. CI and isolated bench
# instances must not touch real ALSA, Bluetooth or camera devices: only the
# null-audio-sink stand-ins from pipewire.conf.d exist.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
