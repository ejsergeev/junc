[package]
name = "junc-l10n"
description = "JUNC language resolution, catalogs and number formatting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
inotify = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
icu_decimal = { version = "2.4.0", optional = true }
fixed_decimal = { version = "0.7.3", optional = true }
icu_locale_core = { version = "2.4.0", optional = true }

[features]
# Locale-aware numbers (ICU4X data): for the CLI and the GUI, not juncd.
numbers = ["dep:icu_decimal", "dep:fixed_decimal", "dep:icu_locale_core"]
