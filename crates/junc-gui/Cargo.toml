[package]
name = "junc-gui"
description = "JUNC graphical interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No Qt backend: winit with femtovg (GPU) and the software renderer
# fallback (architecture §7.1).
slint = { version = "1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
junc-core.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
inotify = "0.11"
junc-ipc.workspace = true
junc-pw = { workspace = true, features = ["meter"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"], optional = true }
png = { version = "0.18.1", optional = true }
zbus = "6.5"
toml = "1.2.3"

[build-dependencies]
slint-build = "1.19.1"

[dev-dependencies]
i-slint-backend-testing = "1.19.1"

[features]
# GUI scenarios (architecture §7.5): `--scenario`, the mock IPC and
# deterministic snapshots with the bundled font. Not in release builds.
scenarios = ["dep:serde", "dep:png", "slint/unstable-fontique-012"]

[[test]]
name = "snapshots"
required-features = ["scenarios"]

[[test]]
name = "main_screen"
required-features = ["scenarios"]
