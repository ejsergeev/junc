name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages
        run: scripts/ci/check-commits.sh "origin/${{ github.base_ref }}" HEAD

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .ci-cache
          key: cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.arch }}-
      - name: Container image
        id: image
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            echo "name=docker.io/library/archlinux:base-devel" >> "$GITHUB_OUTPUT"
          else
            scripts/ci/alarm-image.sh
            echo "name=junc-ci-alarm" >> "$GITHUB_OUTPUT"
          fi
      - name: Checks in Arch container
        # ~20 min warm; a hang must not hold the runner for six hours.
        timeout-minutes: 90
        run: docker run --rm -v "$PWD:/src" -w /src "${{ steps.image.outputs.name }}" scripts/ci/in-container.sh
      - name: systemd user session (A15)
        run: scripts/ci/systemd-user.sh "${{ steps.image.outputs.name }}"
      - name: Bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.arch }}
          path: .ci-cache/target/bench-results.json
          if-no-files-found: ignore
      - name: Restore cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache || true
