# cargo-deny policy. Transitive per-binary rules are in scripts/ci/check-deps.sh.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail anywhere in the tree. "Unmaintained" fails only for
# crates JUNC depends on directly: Slint 1.19 (the GUI) brings unmaintained
# crates of its own (chrono, pin-utils, ttf-parser, and zbus 5's zvariant
# and zbus_names through accesskit), which only a Slint release can
# replace. Owner decision, 2026-11-25.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here can be combined into a GPL-3.0-or-later program.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",       # Slint is GPL-3.0-only OR its own licenses
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates use path dependencies without a version; none are published.
allow-wildcard-paths = true
# Direct-dependency boundaries from docs/architecture.md §2: these crates may
# only be pulled in by the JUNC crate that owns that concern.
deny = [
    { crate = "slint", wrappers = ["junc-gui"] },
    { crate = "pipewire", wrappers = ["junc-pw"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
