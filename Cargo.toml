[workspace]
resolver = "3"
# The validation prototypes are standalone cargo projects kept as reference.
exclude = ["bench"]
members = [
    "crates/junc-core",
    "crates/junc-ipc",
    "crates/junc-pw",
    "crates/junc-l10n",
    "crates/juncd",
    "crates/junc-cli",
    "crates/junc-gui",
    "xtask",
]
default-members = [
    "crates/junc-core",
    "crates/junc-ipc",
    "crates/junc-pw",
    "crates/junc-l10n",
    "crates/juncd",
    "crates/junc-cli",
    "crates/junc-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Arch Linux ARM ships 1.99.1 (2026-11-25); packages build with the distro compiler.
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/ejsergeev/junc"
authors = ["Evgenii Sergeev <ejsergeev@gmail.com>"]

[workspace.dependencies]
junc-core = { path = "crates/junc-core" }
junc-ipc = { path = "crates/junc-ipc" }
junc-pw = { path = "crates/junc-pw" }
junc-l10n = { path = "crates/junc-l10n" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Cargo cannot set panic per package, so every binary aborts on panic. juncd
# relies on systemd restarts and lingering PipeWire objects; the GUI and CLI
# hold no state worth unwinding for.
panic = "abort"

[profile.release.package.juncd]
# Daemon binary size target: < 5 MB stripped.
opt-level = "s"
